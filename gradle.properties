# Project
group=fr.heetstudio.confee
mod_id=confee
mod_name=Confee
mod_author=Heet
mod_version=0.2.0
mod_license=LGPL-3.0-only
mod_source_url=https://github.com/HeetroNoft/Confee
mod_description=Simple config library with auto-generated Bedrock-style screens, plus an in-game editor for other mods' config files.

# Minecraft
minecraft_version=1.20.6
minecraft_version_range=[1.20.5,1.20.6]
# Same range in fabric.mod.json syntax
minecraft_version_range_fabric=>=1.20.5 <=1.20.6
# Every Minecraft version the jars are published for (comma-separated)
minecraft_versions=1.20.5,1.20.6

# Fabric
fabric_loader_version=0.16.9
# Minimum loader declared in fabric.mod.json: low enough for Quilt's Fabric compatibility layer (spec 4.3)
fabric_loader_min_version=0.14.21
fabric_api_version=0.100.8+1.20.6
modmenu_version=10.0.0

# Quilt (dev-only test of the Fabric jar, testenv/quilt)
quilt_loader_version=0.26.4
quilted_fabric_api_version=10.0.0-alpha.3+0.100.4-1.20.6

# NeoForge (own jar since 1.20.2, spec 4.1)
neoforge_version=20.6.144
neoforge_loader_version_range=[1,)
neoforge_version_range=[20.6,)

# Forge
forge_version=50.2.15
forge_loader_version_range=[50,)

# Dev-only cohabitation tests (spec 15), from Modrinth Maven. Never in the published jars.
cloth_config_fabric_version=14.0.139+fabric
cloth_config_forge_version=14.0.139+forge
cloth_config_neoforge_version=14.0.139+neoforge
yacl_fabric_version=3.6.6+1.20.6-fabric

# Publishing (spec 16): release type on Modrinth / CurseForge: alpha, beta or release
release_type=beta
# Publishing targets (not secret; MODRINTH_PROJECT_ID / CURSEFORGE_PROJECT_ID override them)
modrinth_project_id=itTlrYl0
curseforge_project_id=1817213

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
