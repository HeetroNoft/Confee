# Project
group=fr.heetstudio.confee
mod_id=confee
mod_name=Confee
mod_author=Heet
mod_version=0.2.0
mod_license=LGPL-3.0-only
mod_source_url=https://github.com/HeetroNoft/Confee
mod_description=Config library for mod developers. It also adds an in-game config menu to mods that don't have one.

# Minecraft
minecraft_version=26.1.2
minecraft_version_range=[26.1,26.1.2]
# Same range in fabric.mod.json syntax
minecraft_version_range_fabric=>=26.1 <=26.1.2
# Every Minecraft version the jars are published for (comma-separated)
minecraft_versions=26.1,26.1.1,26.1.2

# Fabric
fabric_loader_version=0.20.1
# Minimum loader declared in fabric.mod.json: low enough for Quilt's Fabric compatibility layer (spec 4.3)
fabric_loader_min_version=0.14.21
fabric_api_version=0.155.3+26.1.2
modmenu_version=18.0.2

# Quilt (dev-only test of the Fabric jar, testenv/quilt)
quilt_loader_version=0.30.2

# NeoForm: plain Minecraft for the common module (26.1+)
neoform_version=26.1.2-1

# NeoForge (own jar since 1.20.2, spec 4.1)
neoforge_version=26.1.2.128
neoforge_loader_version_range=[1,)
neoforge_version_range=[26.1,)

# Forge
forge_version=64.1.6
forge_loader_version_range=[64,)

# Dev-only cohabitation tests (spec 15), from Modrinth Maven. Never in the published jars.
cloth_config_fabric_version=26.1.154+fabric
cloth_config_neoforge_version=26.1.154+neoforge

# Publishing (spec 16): release type on Modrinth / CurseForge: alpha, beta or release
release_type=beta
# Publishing targets (not secret; MODRINTH_PROJECT_ID / CURSEFORGE_PROJECT_ID override them)
modrinth_project_id=itTlrYl0
curseforge_project_id=1817213

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
