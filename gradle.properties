# Project
group=fr.heetstudio.confee
mod_id=confee
mod_name=Confee
mod_author=Heet
mod_version=0.3.0
mod_license=LGPL-3.0-only
mod_source_url=https://github.com/HeetroNoft/Confee
mod_description=Config library for mod developers. It also adds an in-game config menu to mods that don't have one.

# Minecraft
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]

# Fabric
fabric_loader_version=0.16.9
# Minimum loader declared in fabric.mod.json: low enough for Quilt's Fabric compatibility layer (spec 4.3)
fabric_loader_min_version=0.14.21
fabric_api_version=0.92.2+1.20.1
modmenu_version=7.2.2

# Quilt (dev-only test of the Fabric jar, testenv/quilt)
quilt_loader_version=0.26.4
quilted_fabric_api_version=7.7.0+0.92.2-1.20.1

# NeoForge 1.20.1 (dev-only test of the Forge code, testenv/neoforge)
neoforge_version=47.1.106

# Forge: compile against 47.1.x only, so the same jar runs on NeoForge 1.20.1 (spec 4.3)
forge_version=47.1.3
forge_loader_version_range=[47,)

# Dev-only cohabitation tests (spec 15), from Modrinth Maven. Never in the published jars.
cloth_config_fabric_version=11.1.136+fabric
cloth_config_forge_version=11.1.136+forge
yacl_fabric_version=3.6.6+1.20.1-fabric
yacl_forge_version=3.6.6+1.20.1-forge

# Publishing (spec 16): release type on Modrinth / CurseForge: alpha, beta or release
release_type=beta
# Publishing targets (not secret; MODRINTH_PROJECT_ID / CURSEFORGE_PROJECT_ID override them)
modrinth_project_id=itTlrYl0
curseforge_project_id=1817213

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
