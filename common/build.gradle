plugins {
    // Minecraft 26.1+ is not obfuscated and VanillaGradle cannot set it up: ModDevGradle in vanilla mode (NeoForm)
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neoform_version
    // the unit tests and the test mod also need Minecraft's classes
    addModdingDependenciesTo sourceSets.test
}

// Test mod (spec 15): shared code, compiled by each loader module. Never published.
sourceSets {
    testmod {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

dependencies {
    compileOnly 'org.jetbrains:annotations:24.1.0'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
