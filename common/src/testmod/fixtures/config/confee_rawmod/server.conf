# HOCON settings of the raw test mod (spec 7.1, V1.1)
include "network"

server {
  # Shown in the server list
  motd = Welcome to the arena
  maxPlayers = 20
  // Seconds before an idle player is kicked
  idleTimeout: 300
  address = ${network.host}":"${network.port}
}

rewards = [
  { item = "minecraft:diamond", count = 1 }
  { item = "minecraft:emerald", count = 4 }
]

welcome = "Hello" ${server.motd}
tags = [pvp, arena] [event]
