plugins {
    id 'net.minecraftforge.gradle'
}

// Test mods (spec 15): never part of the published jar.
// - testmod: uses Confee (annotations, builder, theme)
// - rawmod: does NOT use Confee and has no screen (universal editor)
sourceSets {
    testmod {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
    rawmod {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

// Forge 49+ (dev runs): the classes and resources of a source set must share one folder, else they load as two modules
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

// ForgeGradle 7 (Forge 61+, Gradle 9): runs are Slime Launcher configurations, each with its own mods
// Runs with other names than Forge's own (client, server) get no launch settings: they copy Forge's
def forgeClient = { spec ->
    spec.mainClass = 'net.minecraftforge.bootstrap.ForgeBootstrap'
    spec.args '--gameDir', '.', '--launchTarget', 'forge_userdev_client', '--version', 'MOD_DEV',
            '--assetIndex', '{asset_index}', '--assetsDir', '{assets_root}'
    spec.jvmArgs '-Djava.net.preferIPv6Addresses=system'
    spec.environment 'MCP_MAPPINGS', '{mcp_mappings}'
}
def forgeServer = { spec ->
    spec.mainClass = 'net.minecraftforge.bootstrap.ForgeBootstrap'
    spec.args '--gameDir', '.', '--launchTarget', 'forge_userdev_server'
    spec.jvmArgs '-Djava.net.preferIPv6Addresses=system'
    spec.environment 'MCP_MAPPINGS', '{mcp_mappings}'
}
def testMods = { spec ->
    spec.mods {
        confee { source sourceSets.main }
        confee_testmod { source sourceSets.testmod }
        confee_rawmod { source sourceSets.rawmod }
    }
}
minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            systemProperty 'forge.logging.console.level', 'debug'
        }
        register('client') {
            workingDir = project.file('run')
            mods {
                confee { source sourceSets.main }
            }
        }
        register('server') {
            workingDir = project.file('run-server')
            args '--nogui'
            mods {
                confee { source sourceSets.main }
            }
        }
        register('testmodClient') {
            forgeClient(it)
            workingDir = project.file('run')
            testMods(it)
        }
        register('testmodScreenshots') {
            forgeClient(it)
            workingDir = project.file('run-shots')
            systemProperty 'confee.testmod.screenshots', 'true'
            args '--width', '1280', '--height', '720'
            testMods(it)
        }
        register('testmodServer') {
            forgeServer(it)
            workingDir = project.file('run-server')
            args '--nogui'
            testMods(it)
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    compileOnly project(':common')
    // ForgeGradle 7 runs use the main runtime classpath: the test mods are added to it (dev runs only, never in the jar)
    runtimeOnly sourceSets.testmod.output
    runtimeOnly sourceSets.rawmod.output

    // Cohabitation tests (spec 15): no Cloth Config / YACL build for Forge on this Minecraft version
}

tasks.withType(JavaCompile).matching { it.name == 'compileJava' }.configureEach {
    source(project(':common').sourceSets.main.allSource)
}
tasks.named('compileTestmodJava', JavaCompile) {
    source(project(':common').sourceSets.testmod.java)
}
tasks.named('sourcesJar', Jar) {
    from(project(':common').sourceSets.main.allSource)
}
processResources {
    from project(':common').sourceSets.main.resources
}

// Sample config files of other mods (spec 15), copied into each run folder without overwriting your edits
def fixtures = project(':common').file('src/testmod/fixtures/config')
['run', 'run-shots', 'run-server'].each { dirName ->
    def taskName = "installTestFixtures" + dirName.split('-').collect { it.capitalize() }.join('')
    tasks.register(taskName) {
        doLast {
            fileTree(fixtures).visit { details ->
                def target = file("${dirName}/config/${details.relativePath}")
                if (!details.directory && !target.exists()) {
                    target.parentFile.mkdirs()
                    target.bytes = details.file.bytes
                }
            }
        }
    }
}
tasks.matching { it.name == 'runTestmodClient' }.configureEach { dependsOn 'installTestFixturesRun' }
tasks.matching { it.name == 'runTestmodServer' }.configureEach { dependsOn 'installTestFixturesRunServer' }
tasks.matching { it.name == 'runTestmodScreenshots' }.configureEach { dependsOn 'installTestFixturesRunShots' }


// Publishing (spec 16). Always a dry run unless CONFEE_PUBLISH=true; tokens only come from environment variables.
apply plugin: 'me.modmuss50.mod-publish-plugin'
publishMods {
    file = jar.archiveFile
    changelog = providers.provider { rootProject.versionChangelog() }
    type = providers.provider { me.modmuss50.mpp.ReleaseType.of(release_type) }
    version = "${mod_version}+${minecraft_version}-forge"
    displayName = "Confee ${mod_version} (Forge ${rootProject.mcLabel()})"
    modLoaders.add('forge')
    dryRun = providers.environmentVariable('CONFEE_PUBLISH').map { it != 'true' }.orElse(true)

    modrinth {
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        projectId = providers.environmentVariable('MODRINTH_PROJECT_ID').orElse(modrinth_project_id)
        minecraftVersions.addAll(minecraft_versions.split(','))
    }
    curseforge {
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        projectId = providers.environmentVariable('CURSEFORGE_PROJECT_ID').orElse(curseforge_project_id)
        minecraftVersions.addAll(minecraft_versions.split(','))
        clientRequired = true
        serverRequired = false
    }
}
// Forge 50+ runs on Mojang names: the jar is published as built, without reobfuscation

// Shared testmod resources (preview images...)
tasks.named('processTestmodResources', ProcessResources) {
    from(project(':common').file('src/testmod/resources'))
}
