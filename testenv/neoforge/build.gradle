plugins {
    id 'java'
    id 'net.neoforged.gradle' version '[6.0.18,6.2)'
}

// Development only (spec 15): compiles Confee's Forge module (common + forge sources, unchanged) against
// NeoForge 1.20.1 and runs it with the test mods. Confee compiles against Forge 47.1 so that the same jar runs on
// NeoForge 1.20.1; this checks it really does. Never published.
// Tasks: runTestmodScreenshots, runTestmodClient, runTestmodServer.

def repo = file('../..')
def props = new Properties()
file('../../gradle.properties').withInputStream { props.load(it) }
props.each { k, v -> ext.set(k, v) }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(17)
}

sourceSets {
    main {
        java.srcDirs = [new File(repo, 'forge/src/main/java'), new File(repo, 'common/src/main/java')]
        resources.srcDirs = [new File(repo, 'forge/src/main/resources'), new File(repo, 'common/src/main/resources')]
    }
    testmod {
        java.srcDirs = [new File(repo, 'forge/src/testmod/java'), new File(repo, 'common/src/testmod/java')]
        resources.srcDirs = [new File(repo, 'forge/src/testmod/resources'), new File(repo, 'common/src/testmod/resources')]
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
    rawmod {
        java.srcDirs = [new File(repo, 'forge/src/rawmod/java')]
        resources.srcDirs = [new File(repo, 'forge/src/rawmod/resources')]
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            property 'forge.logging.console.level', 'info'
            mods {
                confee {
                    source sourceSets.main
                }
                confee_testmod {
                    source sourceSets.testmod
                }
                confee_rawmod {
                    source sourceSets.rawmod
                }
            }
        }
        client {
            workingDirectory project.file('run')
        }
        server {
            workingDirectory project.file('run-server')
            args '--nogui'
        }
        testmodClient {
            parent runs.client
            workingDirectory project.file('run')
            taskName 'runTestmodClient'
        }
        testmodScreenshots {
            parent runs.client
            workingDirectory project.file('run-shots')
            taskName 'runTestmodScreenshots'
            property 'confee.testmod.screenshots', 'true'
            args '--width', '1280', '--height', '720'
        }
        testmodServer {
            parent runs.server
            workingDirectory project.file('run-server')
            taskName 'runTestmodServer'
            args '--nogui'
        }
    }
}

dependencies {
    minecraft "net.neoforged:forge:${minecraft_version}-${neoforge_version}"
}

processResources {
    def modProps = [
            mod_id                    : mod_id,
            mod_name                  : mod_name,
            mod_author                : mod_author,
            mod_version               : mod_version,
            mod_license               : mod_license,
            mod_description           : mod_description,
            minecraft_version         : minecraft_version,
            minecraft_version_range   : minecraft_version_range,
            forge_loader_version_range: forge_loader_version_range
    ]
    inputs.properties(modProps)
    filesMatching(['pack.mcmeta', 'META-INF/mods.toml']) {
        expand modProps
    }
}

// Sample config files of other mods, copied into each run folder without overwriting your edits
def fixtures = new File(repo, 'common/src/testmod/fixtures/config')
['run', 'run-shots', 'run-server'].each { dirName ->
    def suffix = dirName.split('-').collect { it.capitalize() }.join('')
    tasks.register("installTestFixtures${suffix}") {
        doLast {
            fileTree(fixtures).visit { details ->
                def target = file("${dirName}/config/${details.relativePath}")
                if (!details.directory && !target.exists()) {
                    target.parentFile.mkdirs()
                    target.bytes = details.file.bytes
                }
            }
        }
    }
}
tasks.matching { it.name == 'runTestmodClient' }.configureEach { dependsOn 'installTestFixturesRun' }
tasks.matching { it.name == 'runTestmodScreenshots' }.configureEach { dependsOn 'installTestFixturesRunShots' }
tasks.matching { it.name == 'runTestmodServer' }.configureEach { dependsOn 'installTestFixturesRunServer' }
