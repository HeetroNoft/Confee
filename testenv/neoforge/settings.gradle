// Development only (spec 15): separate build, because NeoGradle 6 (a ForgeGradle fork) cannot share a build with
// ForgeGradle. Run it through scripts/confee.ps1 (shots-neoforge, neoforge, neoforge-server).
pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'confee-neoforge-test'
