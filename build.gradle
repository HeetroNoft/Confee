plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT' apply false
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)' apply false
    id 'org.spongepowered.gradle.vanilla' version '0.2.1-SNAPSHOT' apply false
    id 'me.modmuss50.mod-publish-plugin' version '0.8.4' apply false
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(17)
        withSourcesJar()
    }

    base {
        archivesName = "${mod_id}"
    }
    // Jar naming (spec 16): confee-<version>+<mc>-<loader>.jar
    version = "${mod_version}+${minecraft_version}-${project.name}"

    repositories {
        mavenCentral()
        maven {
            name = 'Sponge'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release.set(17)
    }

    jar {
        from(rootProject.file('LICENSE')) {
            rename { "${it}_${mod_id}" }
        }
    }

    processResources {
        def props = [
                mod_id                     : mod_id,
                mod_name                   : mod_name,
                mod_author                 : mod_author,
                mod_version                : mod_version,
                mod_license                : mod_license,
                mod_description            : mod_description,
                minecraft_version          : minecraft_version,
                minecraft_version_range    : minecraft_version_range,
                fabric_loader_version      : fabric_loader_version,
                fabric_loader_min_version  : fabric_loader_min_version,
                forge_loader_version_range : forge_loader_version_range
        ]
        inputs.properties(props)
        filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml']) {
            expand props
        }
    }

    tasks.withType(GenerateModuleMetadata).configureEach {
        enabled = false
    }
}
