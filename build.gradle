plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT' apply false
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)' apply false
    id 'net.neoforged.gradle.userdev' version '7.0.165' apply false
    id 'org.spongepowered.gradle.vanilla' version '0.2.1-SNAPSHOT' apply false
    id 'me.modmuss50.mod-publish-plugin' version '0.8.4' apply false
}

// Minecraft versions of the jars, for titles: "1.20.3-1.20.4" (or one version)
ext.mcLabel = { ->
    def versions = minecraft_versions.split(',')
    return versions.size() > 1 ? "${versions.first()}-${versions.last()}" : versions[0]
}

// Changelog of the published version only: the "## <mod_version> ..." section of CHANGELOG.md
ext.versionChangelog = { ->
    def lines = rootProject.file('CHANGELOG.md').readLines('UTF-8')
    def start = lines.findIndexOf { it.startsWith("## ${mod_version} ") }
    if (start < 0) {
        throw new GradleException("[Confee] CHANGELOG.md has no '## ${mod_version} ...' section")
    }
    def end = lines.findIndexOf(start + 1) { it.startsWith('## ') }
    def body = lines.subList(start + 1, end < 0 ? lines.size() : end)
    return body.join('\n').trim()
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
        withSourcesJar()
    }

    base {
        archivesName = "${mod_id}"
    }
    // Jar naming (spec 16): confee-<version>+<mc>-<loader>.jar
    version = "${mod_version}+${minecraft_version}-${project.name}"

    repositories {
        mavenCentral()
        maven {
            name = 'Sponge'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release.set(21)
    }

    // sources are UTF-8: without this, javadoc reads them with the platform encoding (windows-1252) and fails
    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.charSet = 'UTF-8'
        options.docEncoding = 'UTF-8'
    }

    jar {
        from(rootProject.file('LICENSE')) {
            rename { "${it}_${mod_id}" }
        }
    }

    processResources {
        def props = [
                mod_id                     : mod_id,
                mod_name                   : mod_name,
                mod_author                 : mod_author,
                mod_version                : mod_version,
                mod_license                : mod_license,
                mod_description            : mod_description,
                mod_source_url             : mod_source_url,
                minecraft_version          : minecraft_version,
                minecraft_version_range    : minecraft_version_range,
                minecraft_version_range_fabric : minecraft_version_range_fabric,
                fabric_loader_version      : fabric_loader_version,
                fabric_loader_min_version  : fabric_loader_min_version,
                forge_loader_version_range : forge_loader_version_range,
                neoforge_loader_version_range : neoforge_loader_version_range,
                neoforge_version_range     : neoforge_version_range
        ]
        inputs.properties(props)
        filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
            expand props
        }
    }

    tasks.withType(GenerateModuleMetadata).configureEach {
        enabled = false
    }
}
